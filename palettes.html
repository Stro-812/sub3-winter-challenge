<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sub3 Winter Challenge: три палитры и их контраст</title>
<meta name="description" content="Три палитры из библиотеки TASTE для страницы партнёрства s10.run, с измеренным контрастом по WCAG.">
<meta name="theme-color" content="#0f0f0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--surface:#1a1a1a;--ink:#fff;--muted:#8f8f8f;--accent:#dafa9c;--accent-ink:#0f0f0f;--line:color-mix(in oklab,var(--ink) 14%,transparent);--tonal:color-mix(in oklab,var(--ink) 8%,var(--bg));color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.625 "Instrument Sans",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,p,ul,dl,dd{margin:0}ul{padding:0;list-style:none}a{color:inherit}
.wrap{width:min(100% - 2*var(--gut,80px),1280px);margin-inline:auto}
@media (max-width:1023px){:root{--gut:48px}}@media (max-width:639px){:root{--gut:24px}}
header{padding:72px 0 48px}
h1{font:500 clamp(32px,1.714vw + 25px,50px)/1.06 "Instrument Sans",sans-serif;letter-spacing:-0.03em;max-width:20ch;text-wrap:balance}
.lead{margin-top:20px;font-size:clamp(18px,.19vw + 17.3px,20px);line-height:1.5;max-width:64ch}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-bottom:96px}
@media (max-width:1023px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{border-radius:20px;background:var(--surface);padding:32px;display:flex;flex-direction:column;gap:24px;min-width:0}
@media (max-width:639px){.card{padding:24px}.grid{gap:12px}}
.label{font:500 13px/1.25 inherit;color:var(--muted)}
h2{font:500 28px/1.15 "Instrument Sans",sans-serif;letter-spacing:-0.025em;margin-top:6px}
.note{margin-top:8px}
.shot{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.shot iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.sw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.sw li{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.3;color:var(--muted);min-width:0}
.sw i{display:block;height:48px;border-radius:8px;border:1px solid var(--line)}
.sw b{font-weight:500;color:var(--ink)}
.sw span{overflow-wrap:anywhere}
.rows{display:flex;flex-direction:column}
.rows div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:12px;min-height:44px;padding:8px 0;border-top:1px solid var(--line);line-height:1.35}
.rows dd{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.rows small{font:400 13px/1.3 inherit;color:var(--muted);white-space:nowrap}
.ok,.bad{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font:500 13px/1 inherit;margin-left:8px}
.ok{background:color-mix(in oklab,var(--accent) 22%,var(--surface));color:var(--ink)}
.bad{background:#b3261e;color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 24px;border-radius:8px;background:var(--tonal);font-weight:500;text-decoration:none;transition:background-color 120ms cubic-bezier(.2,.8,.2,1),transform 120ms cubic-bezier(.2,.8,.2,1);margin-top:auto}
.btn--primary{background:var(--accent);color:var(--accent-ink)}
@media (hover:hover) and (pointer:fine){.btn:hover{transform:translateY(-1px);background:color-mix(in oklab,var(--ink) 14%,var(--bg))}.btn--primary:hover{background:color-mix(in oklab,var(--accent) 86%,var(--ink))}}
.btn:active{transform:translateY(1px) scale(.985)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Три палитры для страницы партнёрства</h1>
  <p class="lead">Все три взяты из библиотеки TASTE для софтверных страниц и выпали случайной раздачей. Первая стоит на странице по умолчанию. Контраст ниже посчитан в браузере по формуле WCAG 2 из тех же значений, что использует страница.</p>
</div></header>
<main class="wrap"><div class="grid" id="grid"></div></main>
<script>
(function(){
  var P=[
   {id:'soot-pale-lime',name:'Soot and lime',tag:'По умолчанию',note:'Чёрный фон вечерней зимней пробежки и лайм светоотражающей экипировки. Акцент только на кнопках и на месте логотипа партнёра.',
    bg:'#0f0f0f',surface:'#1a1a1a',ink:'#ffffff',muted:'#8f8f8f',accent:'#dafa9c',accentInk:'#0f0f0f',invBg:'#ffffff',invInk:'#0f0f0f',invMuted:'#6a6a6a',rest:50},
   {id:'blue-black-cornflower',name:'Night and sky blue',tag:'Вариант 2',note:'Сине-чёрный фон и небесно-голубой акцент: спокойнее и технологичнее, ближе к спортивным трекерам.',
    bg:'#0a0d14',surface:'#131824',ink:'#e9edf3',muted:'#8891a1',accent:'#5ab9fc',accentInk:'#0a0d14',invBg:'#e9edf3',invInk:'#0a0d14',invMuted:'#585b62',rest:50},
   {id:'cool-white-slate',name:'Frost and slate',tag:'Вариант 3',note:'Светлая версия: холодный белый, сланцевый текст вместо чёрного и бирюзовый акцент. Удобнее для печати и PDF.',
    bg:'#f7f9fa',surface:'#ecf0f2',ink:'#1f3038',muted:'#5d6b72',accent:'#0d7480',accentInk:'#ffffff',invBg:'#1f3038',invInk:'#f7f9fa',invMuted:'#a5adb0',rest:66}
  ];
  function rgb(h){h=h.slice(1);return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16)})}
  function lin(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}
  function L(h){var c=rgb(h);return .2126*lin(c[0])+.7152*lin(c[1])+.0722*lin(c[2])}
  function cr(a,b){var x=L(a),y=L(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
  function mix(a,b,t){var A=rgb(a),B=rgb(b);return '#'+[0,1,2].map(function(i){return ('0'+Math.round(A[i]*t+B[i]*(1-t)).toString(16)).slice(-2)}).join('')}
  var grid=document.getElementById('grid');
  P.forEach(function(p,n){
    var checks=[
      ['Текст на фоне',p.ink,p.bg,7],['Текст на карточке',p.ink,p.surface,7],
      ['Серый текст на фоне',p.muted,p.bg,4.5],['Серый текст на карточке',p.muted,p.surface,4.5],
      ['Надпись на кнопке',p.accentInk,p.accent,4.5],['Акцент и кольцо фокуса на фоне',p.accent,p.bg,3],
      ['Крупная цитата в покое',mix(p.ink,p.bg,p.rest/100),p.bg,3],
      ['Текст в подвале',p.invInk,p.invBg,7],['Серый текст в подвале',p.invMuted,p.invBg,4.5]
    ];
    var rows=checks.map(function(c){var r=cr(c[1],c[2]),ok=r>=c[3];
      return '<div><dt>'+c[0]+'</dt><small>нужно '+String(c[3]).replace('.',',')+':1</small><dd>'+r.toFixed(1).replace('.',',')+':1<span class="'+(ok?'ok':'bad')+'">'+(ok?'проходит':'не проходит')+'</span></dd></div>'}).join('');
    var sw=[['Фон',p.bg],['Карточка',p.surface],['Текст',p.ink],['Серый',p.muted],['Акцент',p.accent],['Подвал',p.invBg]].map(function(s){return '<li><i style="background:'+s[1]+'"></i><b>'+s[0]+'</b><span>'+s[1]+'</span></li>'}).join('');
    var url='index.html'+(n?'?palette='+p.id:'');
    var el=document.createElement('article');el.className='card';
    el.innerHTML='<div><span class="label">'+p.tag+' · '+p.id+'</span><h2>'+p.name+'</h2><p class="note">'+p.note+'</p></div>'
      +'<div class="shot"><iframe src="'+url+'" title="Первый экран страницы в палитре '+p.name+'" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div>'
      +'<ul class="sw">'+sw+'</ul><dl class="rows">'+rows+'</dl>'
      +'<a class="btn'+(n?'':' btn--primary')+'" href="'+url+'">Открыть страницу в этой палитре</a>';
    grid.appendChild(el);
  });
  function fit(){[].forEach.call(document.querySelectorAll('.shot'),function(s){s.firstChild.style.transform='scale('+(s.clientWidth/1440)+')'})}
  addEventListener('resize',fit);fit();
})();
</script>
</body>
</html>
